<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/Cars/css/styles-login.css">
</head>
<body>

  <main class="login-card">
 
    <!-- ================= IZQUIERDA: inputs ================= -->
    <section class="login-left">
 
      <div class="logo">
        <!-- Reemplazá el src por el logo real de tu página -->
        <img src="/Cars/assets/imgs/logo_car.png" alt="Logo">
      </div>
 
      <div class="left-content">
 
        <header class="left-header">
          <h1>Iniciar sesión</h1>
          <p class="sub">Elegí cómo querés ingresar</p>
        </header>
 
        <!-- Selector de rol -->
        <div class="cards" id="cardStep">
 
          <button class="role-card" id="cardUsuario" type="button" data-role="usuario">
            <span class="role-card__icon">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c1.6-4 4.7-6 8-6s6.4 2 8 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </span>
            <span class="role-card__text">
              <span class="role-card__title">Usuario común</span>
              <span class="role-card__desc">Acceso directo, sin credenciales</span>
            </span>
            <span class="role-card__arrow">→</span>
          </button>
 
          <button class="role-card" id="cardAdmin" type="button" data-role="admin">
            <span class="role-card__icon">
              <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <span class="role-card__text">
              <span class="role-card__title">Administrador</span>
              <span class="role-card__desc">Requiere usuario y contraseña</span>
            </span>
            <span class="role-card__arrow">→</span>
          </button>
 
        </div>
 
        <!-- Formulario de administrador -->
        <div class="form-step" id="formStep" hidden>
 
          <button class="back" id="backBtn" type="button">← Volver</button>
 
          <form id="adminForm" novalidate>
 
            <label class="field">
              <span class="field__label">Usuario</span>
              <input class="field__input" type="text" id="adminUser" name="adminUser" autocomplete="username" placeholder="tu.usuario" required>
            </label>
 
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input class="field__input" type="password" id="adminPass" name="adminPass" autocomplete="current-password" placeholder="••••••••" required>
            </label>
 
            <p class="error" id="formError" role="alert" hidden>Completá usuario y contraseña.</p>
 
            <button class="submit" type="submit">
              <span>Ingresar</span>
              <span class="submit__spinner" aria-hidden="true"></span>
            </button>
          </form>
 
        </div>
 
      </div>
 
      <p class="status" id="statusText"></p>
 
    </section>
 
    <!-- ================= DERECHA: imagen de autos ================= -->
    <aside class="login-right">
      <div class="login-right__tag">CARS · ACCESO</div>
      <h2 class="login-right__title">Encontrá tu<br>próximo auto</h2>
      <p class="login-right__sub">Miles de vehículos verificados te esperan del otro lado.</p>
    </aside>
 
  </main>

  <script src="/Cars/js/script-login.js"></script>
</body>
</html>
